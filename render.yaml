# Render Blueprint: tells Render how to run this project.
# In the Render dashboard: New → Blueprint → pick this GitHub repo → fill in the values it asks for.
# Values marked `sync: false` are secrets or yours to choose; they are typed into Render, never committed.
services:
  - type: web
    name: cleanup-co
    runtime: node
    region: frankfurt # closest to Greece
    plan: starter # a paid instance is required for the disk; free ones sleep and lose files
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # The bookings database lives on this disk so it survives deploys and restarts.
    # (With a disk the service always runs as a single instance, which SQLite needs.)
    disk:
      name: bookings
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: BUSINESS_TIMEZONE
        value: Europe/Athens
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      # e.g. https://cleanup-co.onrender.com until you connect your own domain
      - key: PUBLIC_URL
        sync: false
      # Where new-booking emails go, plus the mailbox that sends them (see README → Emails)
      - key: NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
